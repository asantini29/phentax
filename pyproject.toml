[project]
name = "phentax"
version = "0.1.1b6"
description = "JAX Implementation of the IMRPhenomT(HM) waveform family"
author = "Alessandro Santini"
email = "alessandro.santini@aei.mpg.de"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.13.2",
    "isort>=7.0.0",
    "jax>=0.8.1",
    "optimistix>=0.0.11",
    "scipy>=1.16.3",
    "lisaconstants>=2.0.0",
]

[project.optional-dependencies]
cpu = ["jax[cpu]>=0.8.1"]
cuda12 = ["jax[cuda12]>=0.8.1"]
cuda13 = ["jax[cuda13]>=0.8.1"]

[tool.uv]
package = true

[tool.isort]
profile = "black"

[tool.mypy]
disable_error_code = "import-untyped"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "editables"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "mypy>=1.19.0",
    "phenomxpy>=0.1.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pre-commit>=4.5.0",
    "seaborn>=0.13.2",
]
docs = [
    "myst-nb>=1.3.0",
    "myst-parser>=4.0.1",
    "numpydoc>=1.10.0",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme==3.0.2",
    "nbsphinx>=0.9.8",
    "nbstripout>=0.9.1",
    "nbdime>=4.0.4",
]
gpu = [
    "jax[cuda12]>=0.8.1",
]
cpu = [
    "jax[cpu]>=0.8.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]
